# Sixty-four bands, lows first: the edges draw them all, and the island folds
# them into its eight. Raw ASCII on stdout is the cheapest thing for the shell
# to read: one line per frame, values 0 to 100.

[general]
framerate = 30
bars = 64
autosens = 1

# After a second of silence cava stops sending and nearly stops running, and
# it wakes within a few frames of sound. The edges keep it subscribed for as
# long as they are placed, music or not.
sleep_timer = 1

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
mono_option = average

[smoothing]
noise_reduction = 45
